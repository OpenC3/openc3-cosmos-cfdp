# Scans every pull request for obfuscated code, prompt injection, and other
# malicious changes. AI Review (ai-review.yml) waits for it to pass, but the scan
# never starts the review itself. The workflow and scanner live in OpenC3/.github
# (malicious-code-scan-reusable.yml).
#
# This must stay on pull_request_target: the scan then runs from the default
# branch and this repository, so a PR cannot change it. The PR is only ever read
# as data. To scan a PR by hand (e.g. one opened before this workflow was added),
# run this workflow from the Actions tab on main with the PR number.
#
# The result is posted as the commit status `security/malicious-code-scan` on
# the PR head; make that a required check in branch protection. A maintainer
# (write access or above) accepts blocking findings with the
# `malicious-scan-override` label. The workflow name is what ai-review.yml
# expects; keep them in step if you rename it.
#
# Secrets: ANTHROPIC_API_KEY (the Claude review is skipped with a warning without it)

name: Malicious Code Scan

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review
      - labeled
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to scan
        required: true

permissions:
  contents: read

jobs:
  scan:
    uses: OpenC3/.github/.github/workflows/malicious-code-scan-reusable.yml@main
    permissions:
      contents: read
      statuses: write
      pull-requests: write
      actions: read
    with:
      pr_number: ${{ inputs.pr_number }}
      project_description: >-
        OpenC3 COSMOS CFDP plugin, a Ruby (Rails) microservice and script API implementing the
        CCSDS File Delivery Protocol for spacecraft file transfers
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
