# Runs the CFDP microservice's specs on every push and pull request.
# The workflow itself lives in OpenC3/.github so every plugin shares one copy.
# The specs need the test gems in Gemfile.dev, which the deployed microservice's
# Gemfile leaves out.

name: Plugin Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    uses: OpenC3/.github/.github/workflows/plugin-unit-tests-reusable.yml@main
    with:
      plugin_directory: microservices/CFDP
      gemfile: Gemfile.dev
      require_tests: true
